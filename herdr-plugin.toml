id = "user.herdr-workspace-last-tab"
name = "Workspace Last Tab"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Toggle the previous used tab independently in each workspace"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["./target/release/herdr-workspace-last-tab", "listen"]

[[actions]]
id = "switch"
title = "Jump to last tab in this workspace"
contexts = ["global"]
command = ["./target/release/herdr-workspace-last-tab", "switch"]
